<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mystery Region Prototype v2</title><style>:root{--bg:#f5f5f8;--card:#fff;--ink:#17171c;--muted:#6b6b75;--line:#dddde6;--accent:#6b4eff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:30px}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px}h1{font-size:18px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:3px}main{max-width:1050px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:760px){.row{grid-template-columns:1fr}}label{font-size:12px;font-weight:750;display:block;margin-bottom:6px}input,select,button{font:inherit}input[type=file],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}input[type=range]{width:100%}button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:800;padding:9px 12px}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.45}.canvasWrap{background:#ececf1;border-radius:12px;overflow:auto;display:flex;justify-content:center;min-height:220px}canvas{max-width:100%;height:auto;background:#fff;display:block}.val{float:right;font-size:11px;color:#432da9}.note{font-size:11px;color:var(--muted);line-height:1.45}.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.pill{display:flex;align-items:center;gap:5px;padding:4px 7px;border:1px solid var(--line);border-radius:999px;font-size:10px}.dot{width:14px;height:14px;border-radius:50%;border:1px solid #aaa}#status{font-size:12px;margin-top:8px}</style></head><body><header><h1>Mystery Region Prototype v2</h1><div class="sub">Single upload → palette read → composition-aware irregular regions</div></header><main><section class="card"><label>Upload finished artwork + palette</label><input id="upload" type="file" accept="image/*"><div class="note">Use the combined Gengar image you supplied. The mystery reference image is only our design benchmark; this prototype does not ask you to upload it.</div></section><section class="card"><div class="row"><div><label>Artwork/palette split <span id="splitVal" class="val">82%</span></label><input id="split" type="range" min="65" max="95" value="82"></div><div><label>Region density</label><select id="density"><option value="medium">Medium</option><option value="high" selected>High — reference-like</option><option value="veryhigh">Very high</option></select></div></div><div class="row" style="margin-top:10px"><div><label>Shape irregularity <span id="irrVal" class="val">72%</span></label><input id="irr" type="range" min="20" max="95" value="72"></div><div><label>Smoothing <span id="smoothVal" class="val">3</span></label><input id="smooth" type="range" min="1" max="6" value="3"></div></div><div class="row" style="margin-top:10px"><button id="generate" class="primary" disabled>Generate mystery page</button><button id="download" disabled>Export PNG</button></div><div id="status"></div></section><section class="card"><div class="row"><div><h3>Artwork</h3><div class="canvasWrap"><canvas id="art"></canvas></div></div><div><h3>Generated mystery page</h3><div class="canvasWrap"><canvas id="out"></canvas></div></div></div><div id="palette" class="pills"></div></section></main><script>const $=id=>document.getElementById(id),art=$('art'),out=$('out'),actx=art.getContext('2d',{willReadFrequently:true}),octx=out.getContext('2d');let src=null,palette=[];function dist(a,b){const r=a[0]-b[0],g=a[1]-b[1],bb=a[2]-b[2];return r*r+g*g+bb*bb}function nearest(q,p){let bi=0,bd=1e20;for(let i=0;i<p.length;i++){const d=dist(q,p[i]);if(d<bd){bd=d;bi=i}}return bi}function kmeans(samples,k){if(!samples.length)return[];let C=[];for(let i=0;i<k;i++)C.push(samples[Math.floor((i+.5)*samples.length/k)%samples.length].slice());for(let z=0;z<8;z++){const S=Array.from({length:k},()=>[0,0,0,0]);for(const q of samples){let bi=0,bd=1e20;for(let c=0;c<k;c++){const d=dist(q,C[c]);if(d<bd){bd=d;bi=c}}S[bi][0]+=q[0];S[bi][1]+=q[1];S[bi][2]+=q[2];S[bi][3]++}for(let c=0;c<k;c++)if(S[c][3])C[c]=[S[c][0]/S[c][3],S[c][1]/S[c][3],S[c][2]/S[c][3]]}return C.sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]))}function draw(){if(!src)return;const p=+$('split').value/100,cut=Math.round(src.naturalHeight*p),w=Math.min(900,src.naturalWidth),h=Math.round(w*cut/src.naturalWidth);art.width=w;art.height=h;actx.clearRect(0,0,w,h);actx.drawImage(src,0,0,src.naturalWidth,cut,0,0,w,h);extractPalette()}function extractPalette(){const p=+$('split').value/100,w=Math.min(700,src.naturalWidth),sy=Math.round(src.naturalHeight*p),h=Math.max(30,src.naturalHeight-sy),c=document.createElement('canvas');c.width=w;c.height=Math.max(30,Math.round(h*w/src.naturalWidth));const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(src,0,sy,src.naturalWidth,h,0,0,c.width,c.height);const d=g.getImageData(0,0,c.width,c.height).data,s=[];for(let i=0;i<d.length;i+=16){const r=d[i],gg=d[i+1],b=d[i+2],mx=Math.max(r,gg,b),mn=Math.min(r,gg,b),ch=mx-mn,lum=(r+gg+b)/3;if(lum>247)continue;if(ch<8&&lum>205)continue;s.push([r,gg,b])}palette=kmeans(s,18);$('palette').innerHTML=palette.map((c,i)=>`<span class="pill"><span class="dot" style="background:rgb(${c.map(v=>Math.round(v)).join(',')})"></span><b>${i+1}</b></span>`).join('')}function majority(L,w,h,passes){let cur=L;for(let p=0;p<passes;p++){const n=new Uint8Array(cur.length),cnt=new Uint16Array(32);for(let y=0;y<h;y++)for(let x=0;x<w;x++){cnt.fill(0);for(let yy=Math.max(0,y-1);yy<=Math.min(h-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(w-1,x+1);xx++)cnt[cur[yy*w+xx]]++;let b=cur[y*w+x],bn=cnt[b];for(let k=0;k<cnt.length;k++)if(cnt[k]>bn){b=k;bn=cnt[k]}n[y*w+x]=b}cur=n}return cur}function gradient(data,w,h){const lum=new Float32Array(w*h),mag=new Float32Array(w*h);for(let i=0;i<w*h;i++){const j=i*4;lum[i]=data[j]*.299+data[j+1]*.587+data[j+2]*.114}for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x,gx=(-lum[i-w-1]-2*lum[i-1]-lum[i+w-1])+(lum[i-w+1]+2*lum[i+1]+lum[i+w+1]),gy=(-lum[i-w-1]-2*lum[i-w]-lum[i-w+1])+(lum[i+w-1]+2*lum[i+w]+lum[i+w+1]);mag[i]=Math.sqrt(gx*gx+gy*gy)}return mag}function structuralComponents(L,w,h){const seen=new Uint8Array(L.length),out=new Uint32Array(L.length),q=new Int32Array(L.length);let cid=1;for(let s=0;s<L.length;s++){if(seen[s])continue;const lab=L[s];let a=0,b=0;q[b++]=s;seen[s]=1;while(a<b){const i=q[a++],x=i%w,y=i/w|0;out[i]=(lab<<24)|cid;for(const n of [x?i-1:-1,x<w-1?i+1:-1,y?i-w:-1,y<h-1?i+w:-1])if(n>=0&&!seen[n]&&L[n]===lab){seen[n]=1;q[b++]=n}}cid++}return out}function generate(){if(!src||!palette.length)return;const density=$('density').value,irr=+$('irr').value/100,sm=+$('smooth').value,workW=density==='veryhigh'?300:density==='high'?260:220,w=workW,h=Math.round(workW*art.height/art.width),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d',{willReadFrequently:true});g.filter=`blur(${sm*.55}px)`;g.drawImage(art,0,0,w,h);const im=g.getImageData(0,0,w,h),data=im.data;let base=new Uint8Array(w*h);for(let i=0;i<base.length;i++){const j=i*4;base[i]=nearest([data[j],data[j+1],data[j+2]],palette)}base=majority(base,w,h,Math.max(1,Math.floor(sm/2)));const struct=structuralComponents(base,w,h),mag=gradient(data,w,h),step=density==='medium'?14:density==='high'?10:8,seeds=[],byLab=Array.from({length:palette.length},()=>[]);let sid=1;for(let y=step/2;y<h;y+=step)for(let x=step/2;x<w;x+=step){const idx=Math.floor(y)*w+Math.floor(x),edge=Math.min(1,mag[idx]/180);if(edge>.25||Math.random()<.72){const j=step*irr,sx=Math.max(1,Math.min(w-2,x+(Math.random()-.5)*j)),sy=Math.max(1,Math.min(h-2,y+(Math.random()-.5)*j)),lab=base[Math.floor(sy)*w+Math.floor(sx)],s={x:sx,y:sy,lab,id:sid++};seeds.push(s);byLab[lab].push(s)}}const cell=new Uint32Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,lab=base[i],arr=byLab[lab];let bi=0,bd=1e20;for(const s of arr){const dx=x-s.x,dy=y-s.y,d=dx*dx+dy*dy*(.86+(s.id%5)*.04);if(d<bd){bd=d;bi=s.id}}cell[i]=bi}const outW=Math.min(1100,art.width),outH=Math.round(outW*art.height/art.width),sx=outW/w,sy=outH/h;out.width=outW;out.height=outH;octx.fillStyle='#fff';octx.fillRect(0,0,outW,outH);octx.strokeStyle='#777';octx.lineWidth=.85;octx.beginPath();for(let y=0;y<h-1;y++)for(let x=0;x<w-1;x++){const i=y*w+x;if(cell[i+1]!==cell[i]||struct[i+1]!==struct[i]){const xx=(x+1)*sx;octx.moveTo(xx,y*sy);octx.lineTo(xx,(y+1)*sy)}if(cell[i+w]!==cell[i]||struct[i+w]!==struct[i]){const yy=(y+1)*sy;octx.moveTo(x*sx,yy);octx.lineTo((x+1)*sx,yy)}}octx.stroke();octx.strokeStyle='rgba(30,30,45,.85)';octx.lineWidth=1.3;octx.beginPath();for(let y=2;y<h-2;y++)for(let x=2;x<w-2;x++){const i=y*w+x;if(mag[i]<140||(x+y)%2)continue;let n=0;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++)if(mag[(y+yy)*w+x+xx]>112)n++;if(n<5)continue;octx.moveTo(x*sx,y*sy);octx.lineTo((x+1.4)*sx,(y+.35)*sy)}octx.stroke();const stats=new Map();for(let i=0;i<w*h;i++){const key=struct[i]+':'+cell[i];let s=stats.get(key);if(!s){s={n:0,x:0,y:0,lab:base[i]};stats.set(key,s)}s.n++;s.x+=i%w;s.y+=(i/w)|0}octx.textAlign='center';octx.textBaseline='middle';let shown=0;for(const s of stats.values()){if(s.n<12)continue;const x=s.x/s.n*sx,y=s.y/s.n*sy,fs=Math.max(6,Math.min(11,Math.sqrt(s.n)*.42*sx));if(fs<6.5)continue;octx.font=`600 ${fs}px system-ui`;const t=String(s.lab+1),tw=octx.measureText(t).width;octx.fillStyle='rgba(255,255,255,.92)';octx.fillRect(x-tw/2-1.5,y-fs/2-1,tw+3,fs+2);octx.fillStyle='#666';octx.fillText(t,x,y);shown++}$('download').disabled=false;$('status').innerHTML=`<strong>${stats.size.toLocaleString()} regions</strong> generated; ${shown.toLocaleString()} labels placed.`} $('upload').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{src=new Image();src.onload=()=>{draw();$('generate').disabled=false};src.src=r.result};r.readAsDataURL(f)};$('split').oninput=()=>{$('splitVal').textContent=$('split').value+'%';draw()};$('irr').oninput=()=>{$('irrVal').textContent=$('irr').value+'%'};$('smooth').oninput=()=>{$('smoothVal').textContent=$('smooth').value};$('generate').onclick=generate;$('download').onclick=()=>{const a=document.createElement('a');a.download='mystery-prototype-v2.png';a.href=out.toDataURL('image/png');a.click()};</script></body></html>
